[package]
name = "viewgo-receiver"
version = "0.3.11"
edition = "2021"
description = "Windows receiver for ViewGo Android screen mirroring"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
eframe = "0.37.0"
hmac = "0.12"
if-addrs = "0.15"
mdns-sd = "0.22"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
